services:
  - type: web
    name: web-kinox
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/web_kinox/browser
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
